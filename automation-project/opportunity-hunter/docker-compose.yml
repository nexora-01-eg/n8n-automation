services:
  oh-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: opportunity-hunter:0.1.0
    container_name: opportunity-hunter
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      - OH_DB=/data/opps.db
      - OH_PORT=8091
    volumes:
      - ./database:/data
